name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  isolated-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app main.py
      - run: python -m unittest tests.test_release_engine tests.test_release_scanner tests.test_recovery tests.test_session tests.test_workflow tests.test_wizard tests.test_ui_theme tests.test_sort tests.test_drive_label tests.test_native_titlebar -v
        env:
          QT_QPA_PLATFORM: offscreen
